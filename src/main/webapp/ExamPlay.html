<style>

    body {
        font-family: Arial, sans-serif;
        background: #f4f1ff;
        margin: 0;
        padding: 20px;
        color: #172033;
    }

    .container {
        width: 90%;
        max-width: 900px;
        margin: auto;
    }

    /* HEADER */

    .header {
        background: linear-gradient(
            135deg,
            #4a148c,
            #7b1fa2
        );

        color: #ffffff;

        padding: 25px;

        text-align: center;

        border-radius: 12px;

        margin-bottom: 20px;

        box-shadow:
            0 4px 12px rgba(74, 20, 140, 0.25);
    }

    .header h1 {
        margin: 0;
        color: #ffffff;
        font-size: 32px;
    }


    /* EXAM INFORMATION */

    .exam-info {
        background: #ffffff;

        padding: 20px;

        border-radius: 12px;

        margin-bottom: 20px;

        border-left: 6px solid #7b1fa2;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .exam-info h2 {
        color: #6a1b9a;

        margin-top: 0;
    }

    .exam-info p {
        color: #455a64;

        line-height: 1.6;
    }

    .exam-info b {
        color: #37474f;
    }


    /* QUESTION */

    .question {
        background: #ffffff;

        padding: 20px;

        border-radius: 12px;

        margin-bottom: 20px;

        border-left: 5px solid #ff9800;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .question h3 {
        color: #ef6c00;

        margin-top: 0;
    }

    .question p {
        color: #172033;

        font-size: 17px;

        line-height: 1.6;
    }


    /* OPTIONS */

    .option {
        display: block;

        padding: 13px;

        margin: 9px 0;

        background: #eef5ff;

        color: #263238;

        border: 1px solid #b8cff0;

        border-radius: 8px;

        cursor: pointer;

        transition: 0.2s;
    }

    .option:hover {
        background: #ede7f6;

        color: #4a148c;

        border-color: #9575cd;
    }

    .option input {
        margin-right: 8px;
    }


    /* SUBMIT BOX */

    .submit-box {
        background: #ffffff;

        padding: 20px;

        border-radius: 12px;

        margin-bottom: 30px;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.08);
    }


    /* SUBMIT BUTTON */

    .submit-button {
        width: 100%;

        padding: 15px;

        background: #00897b;

        color: #ffffff;

        border: none;

        border-radius: 8px;

        font-size: 18px;

        font-weight: bold;

        cursor: pointer;
    }

    .submit-button:hover {
        background: #00695c;
    }

    .submit-button:disabled {
        background: #78909c;

        color: #ffffff;

        cursor: not-allowed;
    }


    /* LOADING */

    #loading {
        text-align: center;

        font-size: 20px;

        color: #6a1b9a;

        font-weight: bold;

        padding: 20px;
    }


    /* ERROR */

    #error {
        color: #b71c1c;

        background: #ffebee;

        border: 1px solid #ef9a9a;

        padding: 15px;

        border-radius: 8px;

        display: none;

        margin-bottom: 20px;
    }


    /* RESULT LINK INSIDE ERROR */

    #error a {
        color: #6a1b9a;

        font-weight: bold;

        text-decoration: none;
    }

    #error a:hover {
        color: #4a148c;

        text-decoration: underline;
    }

</style>
