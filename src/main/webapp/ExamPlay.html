<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Take Exam</title>

    <style>

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1b1035 0%, #2c1250 45%, #4a1942 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .header {
            background: linear-gradient(120deg, #ff6b6b 0%, #f7b733 100%);
            color: #201021;
            padding: 24px 20px;
            text-align: center;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .header h1 {
            margin: 0;
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        .exam-info {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border-left: 6px solid #6a4cff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        .exam-info h2 {
            color: #2c1250;
            margin-top: 0;
        }

        .exam-info b {
            color: #6a4cff;
        }

        .question {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            border-top: 4px solid #17c3b2;
        }

        .question h3 {
            color: #ff6b6b;
            margin-top: 0;
        }

        .option {
            display: block;
            padding: 12px 14px;
            margin: 8px 0;
            background: #f4f1fb;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            color: #2c1250;
        }

        .option:hover {
            background: #e9e2fb;
            border-color: #6a4cff;
        }

        .submit-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(120deg, #17c3b2 0%, #6a4cff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: opacity 0.15s ease-in-out;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .submit-button:disabled {
            background: #cfc7e6;
            cursor: not-allowed;
        }

        #loading {
            text-align: center;
            font-size: 20px;
            color: #ffffff;
            padding: 40px 0;
        }

        #error {
            color: #7a1f2b;
            background: #ffe1e6;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        #error a {
            color: #6a4cff;
            font-weight: 700;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Online Examination</h1>

    </div>


    <div id="loading">

        Loading exam...

    </div>


    <div id="error"></div>


    <div id="examPage"
         style="display:none;">

        <div class="exam-info">

            <h2 id="examTitle"></h2>

            <p id="examDescription"></p>

            <p>

                <b>Duration:</b>

                <span id="examDuration"></span>

                minutes

            </p>

        </div>


        <!-- ===================================
             EXAM FORM
             =================================== -->

        <form id="examForm"
              action="ExamSubmitServlet"
              method="post">

            <!-- Exam ID -->

            <input type="hidden"
                   id="examId"
                   name="exam_id">


            <!-- Questions -->

            <div id="questionsContainer">

            </div>


            <!-- Submit -->

            <div class="submit-box">

                <button type="submit"
                        class="submit-button">

                    Submit Exam

                </button>

            </div>

        </form>

    </div>

</div>


<script>


    // ==========================================
    // GET EXAM ID
    // ==========================================

    const url =
        new URLSearchParams(
            window.location.search
        );


    /*
     * Supports both:
     *
     * ExamPlay.html?id=3
     *
     * and
     *
     * ExamPlay.html?examId=3
     */

    const examId =
        url.get("id") || url.get("examId");


    // ==========================================
    // CHECK EXAM ID
    // ==========================================

    if (!examId) {

        showError(
            "Exam ID is missing."
        );

    } else {

        document.getElementById(
            "examId"
        ).value = examId;

        loadExam(examId);
    }


    // ==========================================
    // LOAD EXAM
    // ==========================================

    function loadExam(id) {

        fetch(
            "ExamTakeServlet?id=" +
            encodeURIComponent(id)
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server error"
                );
            }

            return response.json();

        })

        .then(function(data) {


            // ==================================
            // ALREADY ATTEMPTED / REDIRECT
            // ==================================

            if (data.alreadyAttempted) {

                document.getElementById(
                    "loading"
                ).style.display = "none";


                const error =
                    document.getElementById(
                        "error"
                    );


                error.innerHTML =

                    "<h2>You have already submitted this exam.</h2>" +

                    "<p>You cannot attempt this exam again.</p>" +

                    "<br>" +

                    "<a href='StudentResult.html?examId=" +
                    encodeURIComponent(id) +
                    "'>View Result</a>";


                error.style.display =
                    "block";


                return;
            }


            // ==================================
            // SERVER REDIRECT
            // ==================================

            if (data.redirect) {

                window.location.href =
                    data.redirect;

                return;
            }


            // ==================================
            // ERROR
            // ==================================

            if (data.error) {

                showError(
                    data.error
                );

                return;
            }


            // ==================================
            // DISPLAY EXAM DETAILS
            // ==================================

            document.getElementById(
                "examTitle"
            ).innerText =
                data.title;


            document.getElementById(
                "examDescription"
            ).innerText =
                data.description;


            document.getElementById(
                "examDuration"
            ).innerText =
                data.duration;


            // ==================================
            // DISPLAY QUESTIONS
            // ==================================

            displayQuestions(
                data.questions
            );


            // ==================================
            // SHOW EXAM PAGE
            // ==================================

            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "examPage"
            ).style.display =
                "block";

        })

        .catch(function(error) {

            console.log(error);

            showError(
                "Error loading exam."
            );

        });

    }


    // ==========================================
    // DISPLAY QUESTIONS
    // ==========================================

    function displayQuestions(questions) {

        const container =
            document.getElementById(
                "questionsContainer"
            );


        container.innerHTML = "";


        if (!questions ||
            questions.length === 0) {

            showError(
                "No questions available."
            );

            return;
        }


        questions.forEach(
            function(q, index) {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "question";


                div.innerHTML =

                    "<h3>Question " +
                    (index + 1) +
                    "</h3>" +

                    "<p><b>" +
                    q.questionText +
                    "</b></p>" +


                    "<label class='option'>" +

                    "<input type='radio' " +

                    "name='q_" +
                    q.id +
                    "' " +

                    "value='A'>" +

                    " " +
                    q.optionA +

                    "</label>" +


                    "<label class='option'>" +

                    "<input type='radio' " +

                    "name='q_" +
                    q.id +
                    "' " +

                    "value='B'>" +

                    " " +
                    q.optionB +

                    "</label>" +


                    "<label class='option'>" +

                    "<input type='radio' " +

                    "name='q_" +
                    q.id +
                    "' " +

                    "value='C'>" +

                    " " +
                    q.optionC +

                    "</label>" +


                    "<label class='option'>" +

                    "<input type='radio' " +

                    "name='q_" +
                    q.id +
                    "' " +

                    "value='D'>" +

                    " " +
                    q.optionD +

                    "</label>";


                container.appendChild(
                    div
                );

            }
        );

    }


    // ==========================================
    // SUBMIT EXAM
    // ==========================================

    let isSubmitting = false;


    const examFormEl =
        document.getElementById(
            "examForm"
        );


    const submitBtnEl =
        document.querySelector(
            ".submit-button"
        );


    examFormEl.addEventListener(
        "submit",
        function(event) {


            // Prevent normal submission first
            event.preventDefault();


            // Prevent double submission
            if (isSubmitting) {

                return;
            }


            // Confirmation
            const confirmSubmit =
                confirm(
                    "Are you sure you want to submit the exam?"
                );


            if (!confirmSubmit) {

                return;
            }


            // ==================================
            // LOCK SUBMISSION
            // ==================================

            isSubmitting = true;


            submitBtnEl.disabled =
                true;


            submitBtnEl.textContent =
                "Please wait...";


            // ==================================
            // NORMAL FORM SUBMISSION
            // ==================================

            /*
             * This sends the form directly to:
             *
             * ExamSubmitServlet
             *
             * The servlet will calculate the score,
             * save the result and redirect to:
             *
             * StudentResult.html?examId=...
             */

            examFormEl.submit();

        }
    );


    // ==========================================
    // SHOW ERROR
    // ==========================================

    function showError(message) {


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const error =
            document.getElementById(
                "error"
            );


        error.innerText =
            message;


        error.style.display =
            "block";

    }


</script>

</body>

</html>
