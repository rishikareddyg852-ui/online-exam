<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Take Exam</title>
<style>
  :root{
    --ink:#201a4d;
    --card:#ffffff;
    --accent:#7c5cff;
    --accent2:#4c2fd9;
    --accent3:#c084fc;
    --accent-soft:#f1ecff;
    --line:#e7e1fb;
    --muted:#7d759c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0 0 60px;
    background:
      radial-gradient(circle at 15% -10%, #a78bfa33, transparent 45%),
      radial-gradient(circle at 100% 0%, #7c5cff33, transparent 40%),
      linear-gradient(180deg,#0f0a2e 0px, #0f0a2e 220px, #f5f2fe 220px, #f5f2fe 100%);
  }
  .sheet{
    width:100%;
    max-width:660px;
    padding:0 18px;
  }
  .top-strip{
    padding:38px 4px 26px;
    color:#fff;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#c7b9ff;
    margin:0 0 8px;
    font-weight:700;
  }
  .exam-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
  }
  .exam-header h1{
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:0.2px;
    font-weight:800;
  }
  .exam-header p{
    margin:0;
    color:#c7b9ff;
    font-size:13.5px;
  }
  .timer{
    flex:0 0 auto;
    font-variant-numeric: tabular-nums;
    font-size:20px;
    font-weight:800;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:10px 20px;
    border-radius:16px;
  }
  .timer .label{
    display:block;
    font-size:10px;
    font-weight:600;
    letter-spacing:1px;
    color:#c7b9ff;
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .progress-track{
    margin-top:22px;
    height:6px;
    border-radius:6px;
    background:rgba(255,255,255,0.15);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--accent3), #fff);
    border-radius:6px;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:11.5px;
    color:#c7b9ff;
    margin-top:8px;
    font-weight:600;
  }

  .qcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px;
    margin-bottom:20px;
    box-shadow:0 12px 30px -12px rgba(76,29,217,0.18);
    position:relative;
    overflow:hidden;
  }
  .qnum{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    color:#fff;
    font-size:12px;
    font-weight:800;
    margin-bottom:12px;
  }
  .qtext{
    font-size:17.5px;
    font-weight:700;
    margin:0 0 18px;
    line-height:1.45;
    color:var(--ink);
  }
  .option{
    display:block;
    position:relative;
    margin-bottom:11px;
  }
  .option input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    margin:0;
    cursor:pointer;
  }
  .option .box{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    transition:border-color .15s, background .15s, transform .12s, box-shadow .15s;
  }
  .option .letter{
    flex:0 0 28px;
    height:28px;
    border-radius:9px;
    border:1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12.5px;
    font-weight:800;
    color:var(--muted);
    background:#faf9ff;
  }
  .option .otext{
    font-size:14.5px;
  }
  .option input:checked + .box{
    border-color:var(--accent);
    background:var(--accent-soft);
    transform:translateX(3px);
    box-shadow:0 6px 16px -6px rgba(124,92,255,0.4);
  }
  .option input:checked + .box .letter{
    border-color:transparent;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    color:#fff;
  }
  .option .box:hover{
    border-color:var(--accent3);
  }

  .submit-row{
    text-align:center;
    margin-top:8px;
  }
  button{
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    color:#fff;
    border:none;
    padding:15px 42px;
    border-radius:14px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(124,92,255,0.55);
    letter-spacing:0.2px;
  }
  button:hover{
    filter:brightness(1.07);
    transform:translateY(-1px);
  }
  #loading{
    color:#c7b9ff;
    font-size:14px;
    padding:0 4px;
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="top-strip">
    <p class="eyebrow">Online Examination</p>
    <div class="exam-header">
      <div>
        <h1 id="examTitle">Loading exam…</h1>
        <p id="examDesc"></p>
      </div>
      <div class="timer">
        <span class="label">Time left</span>
        <span id="timer">--:--</span>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p class="progress-label" id="progressLabel"></p>
  </div>

  <div id="loading">Loading questions…</div>

  <!--
    IMPORTANT: this is a real HTML form that POSTs directly to
    ExamSubmitServlet. ExamSubmitServlet expects:
      - a parameter named "exam_id"
      - one parameter per question named "q_<questionId>" with the
        selected letter (A/B/C/D) as its value
    Because this is a native form submit (not fetch), the browser
    will automatically follow ExamSubmitServlet's redirect to the
    results page after scoring.
  -->
  <form id="examForm" method="POST" action="ExamSubmitServlet" style="display:none;">
    <input type="hidden" name="exam_id" id="examIdField" value="">
    <div id="questionsHost"></div>
    <div class="submit-row">
      <button type="submit">Submit Exam</button>
    </div>
  </form>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const examId = params.get('examId');
  const contextPath = window.location.pathname.split('/').slice(0, 2).join('/');
  const dataUrl = contextPath + '/ExamTakeServlet?examId=' + examId;

  let durationSeconds = 0;
  let timerInterval = null;
  let totalQuestions = 0;

  document.getElementById('examIdField').value = examId;

  fetch(dataUrl)
    .then(res => res.json())
    .then(exam => {

      if (exam.error) {
        document.getElementById('loading').textContent = exam.error;
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('examTitle').textContent = exam.title || 'Exam';
      document.getElementById('examDesc').textContent = exam.description || '';

      durationSeconds = (exam.duration || 0) * 60;
      startTimer();

      const host = document.getElementById('questionsHost');
      totalQuestions = exam.questions.length;
      document.getElementById('progressLabel').textContent =
        totalQuestions + ' question' + (totalQuestions === 1 ? '' : 's') + ' • answer all to submit';

      exam.questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'qcard';

        const num = document.createElement('span');
        num.className = 'qnum';
        num.textContent = idx + 1;
        card.appendChild(num);

        const qText = document.createElement('p');
        qText.className = 'qtext';
        qText.textContent = q.questionText;
        card.appendChild(qText);

        const opts = [
          ['A', q.optionA],
          ['B', q.optionB],
          ['C', q.optionC],
          ['D', q.optionD]
        ];

        opts.forEach(([letter, text]) => {
          const label = document.createElement('label');
          label.className = 'option';

          const input = document.createElement('input');
          input.type = 'radio';
          // IMPORTANT: name must be q_<questionId> to match ExamSubmitServlet
          input.name = 'q_' + q.id;
          input.value = letter;
          input.required = true;
          input.addEventListener('change', updateProgress);

          const box = document.createElement('span');
          box.className = 'box';

          const lSpan = document.createElement('span');
          lSpan.className = 'letter';
          lSpan.textContent = letter;

          const tSpan = document.createElement('span');
          tSpan.className = 'otext';
          tSpan.textContent = text;

          box.appendChild(lSpan);
          box.appendChild(tSpan);
          label.appendChild(input);
          label.appendChild(box);
          card.appendChild(label);
        });

        host.appendChild(card);
      });

      document.getElementById('examForm').style.display = 'block';
    })
    .catch(err => {
      document.getElementById('loading').textContent =
        'Could not load exam. Please try again.';
      console.error(err);
    });

  function updateProgress() {
    const answered = new Set();
    document.querySelectorAll('#questionsHost input[type=radio]:checked')
      .forEach(el => answered.add(el.name));
    const pct = totalQuestions ? Math.round((answered.size / totalQuestions) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent =
      answered.size + ' of ' + totalQuestions + ' answered';
  }

  function startTimer() {
    if (!durationSeconds) return;
    const timerEl = document.getElementById('timer');
    timerInterval = setInterval(() => {
      durationSeconds--;
      const m = Math.floor(durationSeconds / 60).toString().padStart(2, '0');
      const s = (durationSeconds % 60).toString().padStart(2, '0');
      timerEl.textContent = m + ':' + s;
      if (durationSeconds <= 0) {
        clearInterval(timerInterval);
        // time's up - submit the form as-is (native submit, follows redirect)
        document.getElementById('examForm').submit();
      }
    }, 1000);
  }
</script>

</body>
</html>
