<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #2c3e91, #4b6cf5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 18px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(20,30,80,0.28);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h2 {
            margin: 0 0 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #22264a;
        }

        p {
            color: #6b7288;
            font-size: 14px;
            margin-bottom: 26px;
        }

        .btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 13px 16px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2c3e91, #4b6cf5);
            box-shadow: 0 10px 22px rgba(43,62,145,0.28);
        }
        .btn-secondary { background: #a7abc3; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">✅</div>
    <h2>Account Created Successfully</h2>
    <p>Your Admin account has been registered. You can now log in to access the Dashboard.</p>

    <button type="button" class="btn btn-primary" onclick="window.location.href='AdminLoginServlet'">Go to Login</button>
    <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Back to Home</button>
</div>

</body>
</html>
