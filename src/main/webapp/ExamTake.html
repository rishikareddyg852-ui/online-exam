<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Take Exam</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .exam-header {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .exam-header h1 {
            margin-top: 0;
        }

        .exam-info {
            margin-top: 15px;
            font-size: 16px;
        }

        .question-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .question-number {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .option:hover {
            background: #f5f5f5;
        }

        .option input {
            margin-right: 8px;
        }

        .submit-container {
            text-align: center;
            margin: 30px 0;
        }

        .submit-button {
            padding: 12px 30px;
            font-size: 17px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        .submit-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        #error {
            display: none;
            background: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 10px;
            text-align: center;
            color: #c0392b;
        }

        #questionsContainer {
            display: none;
        }

        #examContent {
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Loading -->
    <div id="loading">
        Loading exam...
    </div>


    <!-- Error -->
    <div id="error"></div>


    <!-- Exam Content -->
    <div id="examContent">

        <!-- Exam Header -->
        <div class="exam-header">

            <h1 id="examTitle">
                Exam
            </h1>

            <p id="examDescription"></p>

            <div class="exam-info">

                <strong>Duration:</strong>

                <span id="examDuration">
                    -
                </span>

                minutes

            </div>

        </div>


        <!-- Exam Form -->
        <form
            id="examForm"
            action="ExamSubmitServlet"
            method="post"
        >

            <!-- Hidden Exam ID -->
            <input
                type="hidden"
                id="examId"
                name="exam_id"
            >


            <!-- Questions -->
            <div id="questionsContainer"></div>


            <!-- Submit -->
            <div class="submit-container">

                <button
                    type="submit"
                    class="submit-button"
                >
                    Submit Exam
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    // ---------------------------------------
    // Get Exam ID from URL
    // ---------------------------------------

    const url =
        new URLSearchParams(
            window.location.search
        );

    const examId =
        url.get("id");


    // ---------------------------------------
    // Check Exam ID
    // ---------------------------------------

    if (!examId) {

        showError(
            "Exam ID is missing."
        );

    } else {

        document.getElementById("examId").value =
            examId;

        loadExam(examId);
    }


    // ---------------------------------------
    // Load Exam
    // ---------------------------------------

    function loadExam(id) {

        fetch(
            "ExamTakeServlet?id=" +
            encodeURIComponent(id)
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Failed to load exam."
                );
            }

            return response.json();
        })

        .then(function(data) {

            // ---------------------------------------
            // Already Submitted
            // ---------------------------------------

            if (data.alreadyAttempted) {

                document.getElementById(
                    "loading"
                ).style.display = "none";

                const error =
                    document.getElementById(
                        "error"
                    );

                error.innerHTML =
                    "<h2>You have already submitted this exam.</h2>" +
                    "<p>You cannot attempt this exam again.</p>" +
                    "<br>" +
                    "<a href='StudentResult.html?examId=" +
                    encodeURIComponent(id) +
                    "'>View Result</a>";

                error.style.display =
                    "block";

                return;
            }


            // ---------------------------------------
            // Other Error
            // ---------------------------------------

            if (data.error) {

                showError(
                    data.error
                );

                return;
            }


            // ---------------------------------------
            // Display Exam
            // ---------------------------------------

            document.getElementById(
                "examTitle"
            ).textContent =
                data.title || "Exam";


            document.getElementById(
                "examDescription"
            ).textContent =
                data.description || "";


            document.getElementById(
                "examDuration"
            ).textContent =
                data.duration || "0";


            // ---------------------------------------
            // Display Questions
            // ---------------------------------------

            displayQuestions(
                data.questions
            );


            // ---------------------------------------
            // Show Exam
            // ---------------------------------------

            document.getElementById(
                "loading"
            ).style.display = "none";


            document.getElementById(
                "examContent"
            ).style.display = "block";


            document.getElementById(
                "questionsContainer"
            ).style.display = "block";

        })

        .catch(function(error) {

            console.log(error);

            showError(
                "Unable to load the exam. Please try again."
            );

        });

    }


    // ---------------------------------------
    // Display Questions
    // ---------------------------------------

    function displayQuestions(questions) {

        const container =
            document.getElementById(
                "questionsContainer"
            );


        container.innerHTML = "";


        if (!questions ||
            questions.length === 0) {

            showError(
                "No questions found for this exam."
            );

            return;
        }


        questions.forEach(
            function(question, index) {

                const questionCard =
                    document.createElement(
                        "div"
                    );

                questionCard.className =
                    "question-card";


                // Question Number
                const questionNumber =
                    document.createElement(
                        "div"
                    );

                questionNumber.className =
                    "question-number";

                questionNumber.textContent =
                    "Question " +
                    (index + 1);


                // Question Text
                const questionText =
                    document.createElement(
                        "div"
                    );

                questionText.className =
                    "question-text";

                questionText.textContent =
                    question.questionText;


                // Options
                const options =
                    document.createElement(
                        "div"
                    );


                // Option A
                const optionA =
                    createOption(
                        question.id,
                        "A",
                        question.optionA
                    );


                // Option B
                const optionB =
                    createOption(
                        question.id,
                        "B",
                        question.optionB
                    );


                // Option C
                const optionC =
                    createOption(
                        question.id,
                        "C",
                        question.optionC
                    );


                // Option D
                const optionD =
                    createOption(
                        question.id,
                        "D",
                        question.optionD
                    );


                options.appendChild(optionA);
                options.appendChild(optionB);
                options.appendChild(optionC);
                options.appendChild(optionD);


                questionCard.appendChild(
                    questionNumber
                );

                questionCard.appendChild(
                    questionText
                );

                questionCard.appendChild(
                    options
                );


                container.appendChild(
                    questionCard
                );

            }
        );

    }


    // ---------------------------------------
    // Create Option
    // ---------------------------------------

    function createOption(
        questionId,
        optionValue,
        optionText
    ) {

        const option =
            document.createElement(
                "div"
            );

        option.className =
            "option";


        const label =
            document.createElement(
                "label"
            );


        const radio =
            document.createElement(
                "input"
            );


        radio.type =
            "radio";


        radio.name =
            "q_" +
            questionId;


        radio.value =
            optionValue;


        label.appendChild(
            radio
        );


        label.appendChild(
            document.createTextNode(
                optionValue +
                ". " +
                (optionText || "")
            )
        );


        option.appendChild(
            label
        );


        return option;

    }


    // ---------------------------------------
    // Submit Protection
    // ---------------------------------------

    let isSubmitting = false;


    document.getElementById(
        "examForm"
    ).addEventListener(
        "submit",
        function(event) {

            // Stop normal form submission
            event.preventDefault();


            // ---------------------------------------
            // Prevent Double Click
            // ---------------------------------------

            if (isSubmitting) {

                return;
            }


            // ---------------------------------------
            // Confirmation
            // ---------------------------------------

            const confirmSubmit =
                confirm(
                    "Are you sure you want to submit the exam?"
                );


            if (!confirmSubmit) {

                return;
            }


            submitExamForm();

        }
    );


    // ---------------------------------------
    // Submit Exam
    // ---------------------------------------

    function submitExamForm() {

        // ---------------------------------------
        // Immediately Lock Submission
        // ---------------------------------------

        isSubmitting = true;


        const submitBtn =
            document.querySelector(
                ".submit-button"
            );


        // Disable button immediately
        submitBtn.disabled =
            true;


        // Change button text
        submitBtn.textContent =
            "Please wait...";


        // ---------------------------------------
        // Get Form
        // ---------------------------------------

        const form =
            document.getElementById(
                "examForm"
            );


        const formData =
            new FormData(form);


        // ---------------------------------------
        // Send POST Request
        // ---------------------------------------

        fetch(
            form.action,
            {
                method: "POST",
                body: formData
            }
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server error while submitting"
                );
            }


            // ---------------------------------------
            // Go to Result
            // ---------------------------------------

            window.location.href =
                "StudentResult.html?examId=" +
                encodeURIComponent(
                    examId
                );

        })

        .catch(function(error) {

            console.log(error);


            // ---------------------------------------
            // Allow Retry Only if Network Error
            // ---------------------------------------

            isSubmitting =
                false;


            submitBtn.disabled =
                false;


            submitBtn.textContent =
                "Submit Exam";


            alert(
                "Submission failed due to a network error. Please try again."
            );

        });

    }


    // ---------------------------------------
    // Show Error
    // ---------------------------------------

    function showError(message) {

        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "examContent"
        ).style.display = "none";


        const error =
            document.getElementById(
                "error"
            );


        error.innerHTML =
            "<h2>Error</h2>" +
            "<p>" +
            message +
            "</p>";


        error.style.display =
            "block";

    }

</script>

</body>

</html>
