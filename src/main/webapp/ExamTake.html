<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Take Exam</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .header {
            background: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .exam-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            padding: 12px;
            margin: 8px 0;
            background: #f5f5f5;
            border-radius: 6px;
            cursor: pointer;
        }

        .option:hover {
            background: #e8e8e8;
        }

        .submit-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #218838;
        }

        #loading {
            text-align: center;
            font-size: 20px;
        }

        #error {
            color: red;
            background: #ffe6e6;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Online Examination</h1>

    </div>


    <div id="loading">

        Loading exam...

    </div>


    <div id="error"></div>


    <div id="examPage"
         style="display:none;">

        <div class="exam-info">

            <h2 id="examTitle"></h2>

            <p id="examDescription"></p>

            <p>
                <b>Duration:</b>

                <span id="examDuration"></span>

                minutes
            </p>

        </div>


        <!-- IMPORTANT -->

        <form id="examForm"
              action="ExamSubmitServlet"
              method="post">

            <!-- Exam ID -->

            <input type="hidden"
                   id="examId"
                   name="exam_id">


            <!-- Questions -->

            <div id="questionsContainer">

            </div>


            <div class="submit-box">

                <button type="submit"
                        class="submit-button">

                    Submit Exam

                </button>

            </div>

        </form>

    </div>

</div>


<script>

    // ------------------------------------
    // GET EXAM ID
    // ------------------------------------

    const url =
        new URLSearchParams(
            window.location.search
        );

    const examId =
        url.get("id");


    // ------------------------------------
    // CHECK EXAM ID
    // ------------------------------------

    if (!examId) {

        showError(
            "Exam ID is missing."
        );

    } else {

        document.getElementById(
            "examId"
        ).value = examId;

        loadExam(examId);
    }


    // ------------------------------------
    // LOAD EXAM
    // ------------------------------------

    function loadExam(id) {

        fetch(
            "ExamTakeServlet?id=" +
            encodeURIComponent(id)
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server error"
                );
            }

            return response.json();

        })

        .then(function(data) {

            if (data.error) {

                showError(data.error);

                return;
            }


            document.getElementById(
                "examTitle"
            ).innerText =
                data.title;


            document.getElementById(
                "examDescription"
            ).innerText =
                data.description;


            document.getElementById(
                "examDuration"
            ).innerText =
                data.duration;


            displayQuestions(
                data.questions
            );


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "examPage"
            ).style.display =
                "block";

        })

        .catch(function(error) {

            console.log(error);

            showError(
                "Error loading exam."
            );

        });
    }


    // ------------------------------------
    // DISPLAY QUESTIONS
    // ------------------------------------

    function displayQuestions(questions) {

        const container =
            document.getElementById(
                "questionsContainer"
            );

        container.innerHTML = "";


        if (!questions ||
            questions.length === 0) {

            showError(
                "No questions available."
            );

            return;
        }


        questions.forEach(
            function(q, index) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "question";


                div.innerHTML =

                    "<h3>Question " +
                    (index + 1) +
                    "</h3>" +

                    "<p><b>" +
                    q.questionText +
                    "</b></p>" +

                    "<label class='option'>" +
                    "<input type='radio' " +
                    "name='q_" + q.id + "' " +
                    "value='A'>" +
                    " " + q.optionA +
                    "</label>" +

                    "<label class='option'>" +
                    "<input type='radio' " +
                    "name='q_" + q.id + "' " +
                    "value='B'>" +
                    " " + q.optionB +
                    "</label>" +

                    "<label class='option'>" +
                    "<input type='radio' " +
                    "name='q_" + q.id + "' " +
                    "value='C'>" +
                    " " + q.optionC +
                    "</label>" +

                    "<label class='option'>" +
                    "<input type='radio' " +
                    "name='q_" + q.id + "' " +
                    "value='D'>" +
                    " " + q.optionD +
                    "</label>";


                container.appendChild(div);

            }
        );
    }


    // ------------------------------------
    // SUBMIT CONFIRMATION
    // ------------------------------------

    document.getElementById(
        "examForm"
    ).addEventListener(
        "submit",
        function(event) {

            const confirmSubmit =
                confirm(
                    "Are you sure you want to submit the exam?"
                );

            if (!confirmSubmit) {

                event.preventDefault();
            }

        }
    );


    // ------------------------------------
    // ERROR
    // ------------------------------------

    function showError(message) {

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const error =
            document.getElementById(
                "error"
            );

        error.innerText =
            message;

        error.style.display =
            "block";
    }

</script>

</body>

</html>
