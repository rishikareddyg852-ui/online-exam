<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Manage Exams</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #333;
}

.header {
    background: #1e293b;
    color: white;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
}

.back-btn {
    background: white;
    color: #1e293b;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.container {
    padding: 30px;
}

.page-title {
    margin-bottom: 20px;
}

.page-title h2 {
    margin: 0;
}

.page-title p {
    color: #64748b;
}

.exam-container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #1e293b;
    color: white;
    padding: 14px;
    text-align: left;
}

td {
    padding: 14px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f8fafc;
}

.edit-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 6px;
}

.delete-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
}

.message {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

</style>

</head>

<body>

<div class="header">

<h1>Manage Exams</h1>

<button class="back-btn"
onclick="goDashboard()">

← Dashboard

</button>

</div>

<div class="container">

<div class="page-title">

<h2>Examination List</h2>

<p>
View, edit and delete examinations.
</p>

</div>

<div class="exam-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>Exam Title</th>

<th>Total Questions</th>

<th>Duration</th>

<th>Attempts</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="examTableBody">

<tr>

<td colspan="6"
class="message">

Loading exams...

</td>

</tr>

</tbody>

</table>

</div>

</div>
<script>

function loadExams() {

    fetch("ManageExamServlet")

    .then(function(response) {

        if (!response.ok) {
            throw new Error("Server error");
        }

        return response.json();

    })

    .then(function(exams) {

        var table =
            document.getElementById(
                "examTableBody"
            );

        table.innerHTML = "";


        if (exams.length === 0) {

            table.innerHTML =
                "<tr>" +
                "<td colspan='6' class='message'>" +
                "No exams available." +
                "</td>" +
                "</tr>";

            return;
        }


        for (
            var i = 0;
            i < exams.length;
            i++
        ) {

            var exam = exams[i];

            var row =
                document.createElement("tr");


            row.innerHTML =

                "<td>" +
                exam.id +
                "</td>" +

                "<td>" +
                escapeHTML(exam.title) +
                "</td>" +

                "<td>" +
                exam.totalQuestions +
                "</td>" +

                "<td>" +
                exam.duration +
                " minutes" +
                "</td>" +

                "<td>" +
                exam.attempts +
                "</td>" +

                "<td>" +

                "<button " +
                "class='edit-btn' " +
                "type='button' " +
                "onclick='editExam(" +
                exam.id +
                ")'>" +

                "Edit" +

                "</button>" +

                "<button " +
                "class='delete-btn' " +
                "type='button' " +
                "onclick='deleteExam(" +
                exam.id +
                ")'>" +

                "Delete" +

                "</button>" +

                "</td>";


            table.appendChild(row);

        }

    })

    .catch(function(error) {

        console.log(error);

        document.getElementById(
            "examTableBody"
        ).innerHTML =

            "<tr>" +
            "<td colspan='6' class='message'>" +
            "Unable to load exams." +
            "</td>" +
            "</tr>";

    });

}


function editExam(id) {

    window.location.href =
        "EditExam.html?id=" + id;

}


function deleteExam(id) {

    var answer =
        confirm(
            "Are you sure you want to delete this exam?"
        );


    if (!answer) {

        return;

    }


    fetch(
        "DeleteExamServlet?id=" + id
    )

    .then(function(response) {

        return response.text();

    })

    .then(function(result) {

        alert(result);

        loadExams();

    })

    .catch(function(error) {

        console.log(error);

        alert(
            "Error deleting exam."
        );

    });

}


function goDashboard() {

    window.location.href =
        "AdminDashboardServlet";

}
function escapeHTML(text) {

    if (text == null) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* PAGE LOAD */

window.onload = function() {

    loadExams();

};

</script>

</body>

</html>
