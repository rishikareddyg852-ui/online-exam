<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Student Results</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .container {
            width: 90%;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .button-container {
            width: 250px;
            margin: 0 auto 30px auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .dashboard-btn {
            background-color: #007bff;
        }

        .dashboard-btn:hover {
            background-color: #0056b3;
        }

        .refresh-btn {
            background-color: #28a745;
        }

        .refresh-btn:hover {
            background-color: #1e7e34;
        }

        .back-btn {
            background-color: #6c757d;
        }

        .back-btn:hover {
            background-color: #545b62;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #343a40;
            color: white;
            padding: 14px;
            border: 1px solid #ddd;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error-msg {
            text-align: center;
            padding: 15px;
            color: #991b1b;
            background: #fee2e2;
            border-radius: 6px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Student Results</h2>

        <div class="button-container">

            <button
                type="button"
                class="dashboard-btn"
                onclick="window.location.href='AdminDashboardServlet'">
                Dashboard
            </button>

            <button
                type="button"
                class="refresh-btn"
                onclick="loadResults()">
                Refresh Results
            </button>

            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='AdminDashboardServlet'">
                Back to Dashboard
            </button>

        </div>

        <div id="message"></div>

        <table>

            <thead>
                <tr>
                    <th>Student</th>
                    <th>Exam</th>
                    <th>Score</th>
                    <th>Percentage</th>
                    <th>Submitted On</th>
                </tr>
            </thead>

            <tbody id="resultsTableBody">
                <tr>
                    <td colspan="5" class="loading">Loading results...</td>
                </tr>
            </tbody>

        </table>

    </div>

    <script>

        window.onload = function () {
            loadResults();
        };

        function loadResults() {

            const tableBody = document.getElementById("resultsTableBody");

            tableBody.innerHTML =
                "<tr><td colspan='5' class='loading'>Loading results...</td></tr>";

            fetch("AdminViewResultServlet")

                .then(function (response) {

                    if (!response.ok) {
                        throw new Error("Server error");
                    }

                    return response.json();

                })

                .then(function (data) {

                    if (data.error) {
                        showError(data.error);
                        tableBody.innerHTML = "";
                        return;
                    }

                    document.getElementById("message").innerHTML = "";

                    displayResults(data.results || data);

                })

                .catch(function (error) {

                    console.log(error);

                    showError("Unable to load results.");

                    tableBody.innerHTML = "";

                });

        }

        function displayResults(results) {

            const tableBody = document.getElementById("resultsTableBody");

            tableBody.innerHTML = "";

            if (!results || results.length === 0) {

                tableBody.innerHTML =
                    "<tr><td colspan='5' class='no-results'>No results submitted yet.</td></tr>";

                return;
            }

            results.forEach(function (r) {

                const row = document.createElement("tr");

                const score = r.score + " / " + r.totalMarks;
                const percentage = r.percentage + "%";

                row.innerHTML =
                    "<td>" + escapeHtml(r.studentName) + "</td>" +
                    "<td>" + escapeHtml(r.examTitle) + "</td>" +
                    "<td>" + escapeHtml(score) + "</td>" +
                    "<td>" + escapeHtml(percentage) + "</td>" +
                    "<td>" + escapeHtml(r.submittedOn) + "</td>";

                tableBody.appendChild(row);

            });

        }

        function showError(message) {

            document.getElementById("message").innerHTML =
                "<div class='error-msg'>" + escapeHtml(message) + "</div>";

        }

        function escapeHtml(text) {

            if (text === null || text === undefined) {
                return "";
            }

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>

</body>
</html>
